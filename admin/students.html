<!doctype html><html lang="az"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Şagirdlər</title><link rel="stylesheet" href="../css/style.css"></head><body><div class="app"><aside class="side"><div class="sidebrand"><span class="crest">QM</span><div>Qazangül<br><small>Super Admin</small></div></div><nav><a href="dashboard.html">⌂ İdarə paneli</a><a class="active" href="students.html">🎓 Şagirdlər</a><a href="classes.html">🏫 Siniflər</a><a href="teachers.html">👨‍🏫 Müəllimlər</a><a href="codes.html">🔑 Giriş kodları</a><a href="../index.html">← Sayta qayıt</a></nav></aside><main class="main"><div class="apphead"><div><small class="muted">Super Admin</small><h1>Şagirdlər</h1></div><div class="status" data-db><span class="dot"></span>Yoxlanılır...</div></div><div class="panel"><div class="panelbar"><div><b>Şagirdlər</b><div class="muted">Real Firestore siyahısı</div></div><button class="btn" id="add">+ Şagird əlavə et</button></div><div id="form" class="panelbody" hidden><div class="formgrid"><div class="field"><label>Ad və soyad</label><input id="fullName" placeholder="Ad Soyad"></div><div class="field"><label>Sinif</label><select id="classId"><option value="">Sinif seçin</option></select></div></div><div style="margin-top:14px"><button class="btn" id="save">Yadda saxla</button></div><p id="msg" class="muted"></p></div><div id="list"></div></div></main></div><script src="../js/main.js"></script><script src="../js/app.js"></script><script type="module">
import {auth,onAuthStateChanged,idToken} from '../js/firebase-client.js';const list=document.querySelector('#list'),form=document.querySelector('#form'),msg=document.querySelector('#msg');let classes={};add.onclick=()=>form.hidden=!form.hidden;
async function api(url,opt={}){const t=await idToken();const r=await fetch(url,{...opt,headers:{'Content-Type':'application/json',Authorization:'Bearer '+t,...opt.headers}});const j=await r.json();if(!r.ok)throw new Error(j.error);return j}
async function load(){try{const [c,s]=await Promise.all([api('/api/admin/classes'),api('/api/admin/students')]);classes=Object.fromEntries(c.items.map(x=>[x.id,x.name]));classId.innerHTML='<option value="">Sinif seçin</option>'+c.items.map(x=>`<option value="${x.id}">${x.name}</option>`).join('');list.innerHTML=s.items.length?'<div class="table"><table><tr><th>Şagird</th><th>Sinif</th><th>Status</th></tr>'+s.items.map(x=>`<tr><td><b>${x.fullName}</b></td><td>${classes[x.classId]||'—'}</td><td><span class="badge">Aktiv</span></td></tr>`).join('')+'</table></div>':'<div class="empty"><div class="ico">🎓</div><b>Hələ şagird yoxdur</b><p>Şagird əlavə etmək üçün yuxarıdakı düymədən istifadə edin.</p></div>'}catch(e){list.innerHTML='<div class="empty">Xəta: '+e.message+'</div>'}}
save.onclick=async()=>{try{if(!fullName.value.trim()||!classId.value){msg.textContent='Ad və sinif mütləqdir.';return}save.disabled=true;await api('/api/admin/students',{method:'POST',body:JSON.stringify({fullName:fullName.value.trim(),classId:classId.value})});fullName.value='';form.hidden=true;await load()}catch(e){msg.textContent='Xəta: '+e.message}finally{save.disabled=false}};onAuthStateChanged(auth,u=>u?load():location.href='../login.html');
</script></body></html>
