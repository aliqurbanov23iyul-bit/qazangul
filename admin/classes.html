<!doctype html><html lang="az"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Siniflər</title><link rel="stylesheet" href="../css/style.css"></head><body><div class="app"><aside class="side"><div class="sidebrand"><span class="crest">QM</span><div>Qazangül<br><small>Super Admin</small></div></div><nav><a href="dashboard.html">⌂ İdarə paneli</a><a href="students.html">🎓 Şagirdlər</a><a class="active" href="classes.html">🏫 Siniflər</a><a href="teachers.html">👨‍🏫 Müəllimlər</a><a href="codes.html">🔑 Giriş kodları</a><a href="../index.html">← Sayta qayıt</a></nav></aside><main class="main"><div class="apphead"><div><small class="muted">Super Admin</small><h1>Siniflər</h1></div><div class="status" data-db><span class="dot"></span>Yoxlanılır...</div></div><div class="panel"><div class="panelbar"><div><b>Siniflərin idarəsi</b><div class="muted">Məktəbdəki sinifləri yaradın.</div></div><button class="btn" id="add">+ Sinif yarat</button></div><div id="form" class="panelbody" hidden><div class="formgrid"><div class="field"><label>Sinif adı</label><input id="className" placeholder="Məs: 10A"></div></div><div style="margin-top:14px"><button class="btn" id="save">Yadda saxla</button></div><p id="msg" class="muted"></p></div><div id="list"></div></div></main></div><script src="../js/main.js"></script><script src="../js/app.js"></script><script type="module">
import {auth,onAuthStateChanged,idToken} from '../js/firebase-client.js';const list=document.querySelector('#list'),form=document.querySelector('#form'),msg=document.querySelector('#msg');add.onclick=()=>form.hidden=!form.hidden;
async function api(url,opt={}){const t=await idToken();const r=await fetch(url,{...opt,headers:{'Content-Type':'application/json',Authorization:'Bearer '+t,...opt.headers}});const j=await r.json();if(!r.ok)throw new Error(j.error);return j}
async function load(){try{const j=await api('/api/admin/classes');list.innerHTML=j.items.length?'<div class="table"><table><tr><th>Sinif</th><th>Status</th></tr>'+j.items.map(x=>`<tr><td><b>${x.name}</b></td><td><span class="badge">Aktiv</span></td></tr>`).join('')+'</table></div>':'<div class="empty"><div class="ico">🏫</div><b>Hələ sinif yoxdur</b><p>İlk sinfi yaradın.</p></div>'}catch(e){list.innerHTML='<div class="empty">Xəta: '+e.message+'</div>'}}
save.onclick=async()=>{try{if(!className.value.trim())return;save.disabled=true;await api('/api/admin/classes',{method:'POST',body:JSON.stringify({name:className.value.trim()})});className.value='';form.hidden=true;await load()}catch(e){msg.textContent='Xəta: '+e.message}finally{save.disabled=false}};onAuthStateChanged(auth,u=>u?load():location.href='../login.html');
</script></body></html>
