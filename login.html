<!doctype html><html lang="az"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Giriş • Qazangül Məktəbi</title><link rel="stylesheet" href="css/style.css"></head><body><div class="login"><div class="loginvisual"><div class="logintext"><span class="pill">Qazangül Məktəbi</span><h1>Məktəbin rəqəmsal qapısı.</h1><p>Şagirdlər giriş kodu ilə, əməkdaşlar isə məktəb hesabı ilə daxil olur.</p></div></div><div class="loginbox"><div class="authcard"><a class="brand" href="index.html"><span class="crest">QM</span><span>Qazangül Məktəbi</span></a><h2 style="margin-top:26px">Platformaya giriş</h2><p class="muted">Açıq qeydiyyat yoxdur. Hesablar məktəb tərəfindən yaradılır.</p><div class="tabs"><button class="active" onclick="studentTab(this)">Şagird</button><button onclick="staffTab(this)">Müəllim / Admin</button></div><div id="student"><div class="field"><label>Şəxsi giriş kodu</label><input id="studentCode" autocomplete="off" placeholder="Məs: 8QK7-X4NP-M2TZ"></div><p class="muted" style="font-size:12px">Kodunuz sinif rəhbəri tərəfindən verilir.</p><button id="studentLoginBtn" class="btn" style="width:100%">Daxil ol</button></div><div id="staff" hidden><div class="field"><label>E-poçt</label><input id="staffEmail" type="email" placeholder="muellim@mekteb.az"></div><br><div class="field"><label>Şifrə</label><input id="staffPassword" type="password" placeholder="••••••••"></div><br><button id="staffLoginBtn" class="btn" style="width:100%">Daxil ol</button></div><p id="authmsg" class="muted" style="font-size:12px;margin-top:18px">Giriş məlumatlarınızı daxil edin.</p></div></div></div><script src="js/main.js"></script><script>function studentTab(b){document.querySelector('#student').hidden=false;document.querySelector('#staff').hidden=true;document.querySelectorAll('.tabs button').forEach(x=>x.classList.remove('active'));b.classList.add('active')}function staffTab(b){document.querySelector('#student').hidden=true;document.querySelector('#staff').hidden=false;document.querySelectorAll('.tabs button').forEach(x=>x.classList.remove('active'));b.classList.add('active')}</script><script type="module">
import {auth,signInWithEmailAndPassword,signInWithCustomToken} from './js/firebase-client.js';
const msg=document.querySelector('#authmsg');
studentLoginBtn.onclick=async()=>{try{msg.textContent='Yoxlanılır...';const r=await fetch('/api/auth/student-login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({code:studentCode.value})});const j=await r.json();if(!r.ok)throw new Error(j.error||'Giriş alınmadı');await signInWithCustomToken(auth,j.token);location.href='student/dashboard.html'}catch(e){msg.textContent=e.message==='invalid_code'?'Kod yanlışdır.':e.message}};
staffLoginBtn.onclick=async()=>{try{msg.textContent='Yoxlanılır...';const c=await signInWithEmailAndPassword(auth,staffEmail.value,staffPassword.value);const t=await c.user.getIdTokenResult(true);const role=t.claims.role;if(role==='super_admin')location.href='admin/dashboard.html';else location.href='teacher/dashboard.html'}catch(e){msg.textContent='E-poçt və ya şifrə yanlışdır.'}};
</script></body></html>
